## This Alfresco Platform Configuration file should be used for custom properties that are introduced by this module.
## Define default values for all properties here.
## System Administrators can override these values in environment specific configurations in
## alfresco/tomcat/shared/classes/alfresco-global.properties.
## 

# Import compatibility: true => reject packages with incompatible exporter version.
migrator.import.compatibility.strict=false

# Import UUID binding strategy (CREATE_NEW, CREATE_NEW_WITH_UUID, REMOVE_EXISTING,
# REPLACE_EXISTING, UPDATE_EXISTING, THROW_ON_COLLISION).
migrator.import.uuid.binding=CREATE_NEW

# Import version history from ACP <view:versions> blocks when present.
migrator.import.include.version.history=true